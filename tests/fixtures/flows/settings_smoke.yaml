schema: autonom.dev/flow/v1
appId: com.android.settings
name: Settings smoke
description: Smoke against the preinstalled Settings app on an emulator
tags:
  - smoke
  - ci
requires:
  platform:
    - android
---
# Cold-start: an earlier manual step may have left Settings on a subscreen,
# and a monkey relaunch resumes wherever Settings was.
- stopApp
- launchApp
- assertVisible:
    selector:
      text: Battery
      match: exact
    timeoutMs: 30000
- tapOn:
    selector:
      text: Battery
      match: exact
- takeScreenshot
