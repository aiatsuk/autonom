name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run: every main commit keeps
  # a completed verdict even when merges land in quick succession.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  # One Linux job on the minimum supported Python (MIN_PYTHON in
  # scripts/autonom.py); it also runs the tty_guard pass. The newest Python is
  # covered by the macOS job on main.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # import.meta.dirname in tests/browser-bridge.test.mjs needs >= 20.11.
          node-version: "22"
      - name: Tool gates
        # The suite shells out to openssl with no skip guard, and the lint is
        # only real when shellcheck exists — fail here, not silently later.
        run: |
          shellcheck --version
          openssl version
          node --version
          python3 --version
      - name: Run the full check suite
        env:
          AUTONOM_REQUIRE_SHELLCHECK: "1"
          AUTONOM_SKIP_TTY_GUARD: "0"
        run: ./scripts/run_checks.sh

  # macOS is the slowest and most expensive leg: run it on main only. Pull
  # requests are covered by the two Linux legs above.
  checks-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
      - name: Tool gates
        run: |
          shellcheck --version
          openssl version
          node --version
          python3 --version
      - name: Run the full check suite
        env:
          AUTONOM_REQUIRE_SHELLCHECK: "1"
          AUTONOM_SKIP_TTY_GUARD: "1"
        run: ./scripts/run_checks.sh
