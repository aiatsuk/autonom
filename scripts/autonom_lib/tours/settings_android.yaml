schema: autonom.dev/flow/v1
appId: com.android.settings
name: Tour — Android Settings
description: Launch Settings fresh, open Network & internet, then Internet, and come back - automatic evidence stays attached to each action
tags:
  - tour
requires:
  platform:
    - android
---
- launchApp:
    label: Launch Settings on a cleared task
- assertVisible:
    selector:
      text: ^Network (&|and) [Ii]nternet$
      match: regex
    timeoutMs: 15000
    label: The Settings home screen is up
- assertVisible:
    selector:
      text: ^(Apps|Apps & notifications|Connected devices)$
      match: regex
    timeoutMs: 10000
    label: The home lists the other top-level entries
- tapOn:
    selector:
      text: ^Network (&|and) [Ii]nternet$
      match: regex
    label: Open "Network & internet"
- assertVisible:
    selector:
      text: ^(Internet|Wi.?Fi)$
      match: regex
    timeoutMs: 10000
    label: The "Network & internet" screen is up
- assertNotVisible:
    selector:
      text: ^(Apps|Apps & notifications|Connected devices)$
      match: regex
    timeoutMs: 10000
    label: The home entries are gone
- assertVisible:
    selector:
      description: ^Network (&|and) [Ii]nternet$
      match: regex
    timeoutMs: 10000
    label: The toolbar titles the screen "Network & internet"
- tapOn:
    selector:
      text: ^(Internet|Wi.?Fi)$
      match: regex
    label: Open "Internet"
- assertVisible:
    selector:
      description: ^(Internet|Wi.?Fi)$
      match: regex
    timeoutMs: 10000
    label: The toolbar titles the screen "Internet"
- assertNotVisible:
    selector:
      description: ^Network (&|and) [Ii]nternet$
      match: regex
    timeoutMs: 10000
    label: The "Network & internet" title is gone
- back:
    label: Back to "Network & internet"
- assertVisible:
    selector:
      description: ^Network (&|and) [Ii]nternet$
      match: regex
    timeoutMs: 10000
    label: The "Network & internet" title is back, which the "Internet" screen lacks
- assertVisible:
    selector:
      text: ^(Internet|Wi.?Fi)$
      match: regex
    timeoutMs: 10000
    label: The "Internet" entry is listed again
- back:
    label: Back to the Settings home
- assertVisible:
    selector:
      text: ^(Apps|Apps & notifications|Connected devices)$
      match: regex
    timeoutMs: 10000
    label: The Settings home screen is back, with its top-level entries
- assertNotVisible:
    selector:
      text: ^(Internet|Wi.?Fi)$
      match: regex
    timeoutMs: 10000
    label: The "Network & internet" list is gone
